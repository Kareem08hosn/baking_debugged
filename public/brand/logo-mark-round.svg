<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Baking Debugged</title>
  <!-- Round badge with transparent corners: for use on a page -->
  <circle cx="256" cy="256" r="256" fill="#14342B"/>
  <g fill="none" stroke="#F6E7B4" stroke-linecap="round" stroke-linejoin="round">
    <!-- < and > -->
    <polyline points="150,172 68,256 150,340" stroke-width="34"/>
    <polyline points="362,172 444,256 362,340" stroke-width="34"/>
    <!-- the slash is a whisk -->
    <g transform="translate(256 256) rotate(22)">
      <ellipse cx="0" cy="-58" rx="50" ry="88" stroke-width="18"/>
      <ellipse cx="0" cy="-58" rx="17" ry="88" stroke-width="14"/>
      <line x1="0" y1="34" x2="0" y2="140" stroke-width="34"/>
    </g>
  </g>
</svg>
